name: Debug Mercedes Connectivity

on:
  workflow_dispatch:

jobs:
  debug-mercedes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test Mercedes URLs
        run: python debug_mercedes_connectivity.py